<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Догонялки Платформер v3.9 - Плавное Движение</title>
<link rel="stylesheet" href="styles.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
</head>
<body>
  <div id="startScreen" class="start-screen">
    <div class="start-panel">
      <div class="map-select" role="group" aria-label="Map">
        <button type="button" class="map-button active" data-map="islands">
          <span class="map-swatch island-swatch"></span>
          Island
        </button>
        <button type="button" class="map-button" data-map="cosmos">
          <span class="map-swatch cosmos-swatch"></span>
          Cosmos
        </button>
      </div>
      <div class="mode-select" role="group" aria-label="Players">
        <button id="singleButton" class="mode-button">1 Player</button>
        <button id="twoButton" class="mode-button">2 Players</button>
      </div>
    </div>
  </div>
  <canvas id="gameCanvas" width="800" height="600"></canvas>
  <script type="module" src="game.js"></script>
</body>
</html>
